$kind: http-request
name: Products Post Basil Plant
method: POST
url: 'http://127.0.0.1:8000/products/'
body:
  type: json
  content: |-
    {
      "name": "Basil Plant - 4in Pot",
      "unit": "each",
      "cost_per_unit": 1.75,
      "price_per_unit": 4.99,
      "quantity_in_stock": 40,
      "category_id": 1
    }
tests:
  - name: 'Status code is 201'
    script: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });
  - name: 'Save product id for follow-up requests'
    script: |-
      pm.test("Save product id for follow-up requests", function () {
        const json = pm.response.json();
        pm.collectionVariables.set("product_id", String(json.id));
      });
