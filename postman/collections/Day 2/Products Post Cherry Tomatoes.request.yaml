$kind: http-request
name: Products Post Cherry Tomatoes
method: POST
url: 'http://127.0.0.1:8000/products/'
body:
  type: json
  content: |-
    {
      "name": "Cherry Tomatoes - 1lb Clamshell",
      "unit": "lb",
      "cost_per_unit": 1.10,
      "price_per_unit": 3.49,
      "quantity_in_stock": 52,
      "category_id": 1
    }
tests:
  - name: 'Status code is 201'
    script: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });
  - name: 'Save product id for follow-up requests'
    script: |-
      pm.test("Save product id for follow-up requests", function () {
        const json = pm.response.json();
        pm.collectionVariables.set("product_id", String(json.id));
      });
