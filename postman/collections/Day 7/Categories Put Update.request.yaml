$kind: http-request
name: Categories Put Update
method: PUT
url: 'http://127.0.0.1:8000/categories/2'
body:
  type: json
  content: |-
    {
      "name": "Herbs and Greens",
      "description": "Fresh herbs and leafy greens"
    }
tests:
  - name: 'Status code is 200'
    script: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
  - name: 'Response has id, name, and description fields'
    script: |-
      pm.test("Response has id, name, and description fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("name");
        pm.expect(json).to.have.property("description");
      });
  - name: 'Response name matches updated name'
    script: |-
      pm.test("Response name matches updated name", function () {
        const json = pm.response.json();
        pm.expect(json.name).to.eql("Herbs and Greens");
      });
  - name: 'Response description matches updated description'
    script: |-
      pm.test("Response description matches updated description", function () {
        const json = pm.response.json();
        pm.expect(json.description).to.eql("Fresh herbs and leafy greens");
      });
  - name: 'Response id matches updated category id'
    script: |-
      pm.test("Response id matches updated category id", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(2);
      });
  - name: 'Response time is less than 500ms'
    script: |-
      pm.test("Response time is less than 500ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(500);
      });
